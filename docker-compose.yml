# Postgres cho dev và test. User/password tickethub chỉ dùng ở máy local.
services:
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tickethub
      POSTGRES_USER: tickethub
      POSTGRES_PASSWORD: tickethub
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickethub -d tickethub"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_test:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: tickethub_test
      POSTGRES_USER: tickethub
      POSTGRES_PASSWORD: tickethub
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickethub -d tickethub_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    ports:
      - "4000:4000"
    env_file:
      - api/.env
    environment:
      # Trong container, localhost là chính container api; DB nằm ở service "db".
      DATABASE_URL: postgres://tickethub:tickethub@db:5432/tickethub
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
