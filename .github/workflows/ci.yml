name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tickethub_test
          POSTGRES_USER: tickethub
          POSTGRES_PASSWORD: tickethub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tickethub -d tickethub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Giá trị giả, chỉ dùng cho CI. Không phải secret thật.
    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgres://tickethub:tickethub@localhost:5432/tickethub_test
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Create .env.test
        run: |
          printf '%s\n' \
            "NODE_ENV=$NODE_ENV" \
            "PORT=$PORT" \
            "DATABASE_URL=$DATABASE_URL" \
            "JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET" \
            "JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET" \
            "CORS_ORIGIN=$CORS_ORIGIN" > .env.test
      - run: npm run migrate:test
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
